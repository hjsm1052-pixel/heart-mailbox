
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀스러운 고백 우체통 💌</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Malgun Gothic", Arial, sans-serif;
  color: #63394f;
  background: linear-gradient(
    135deg,
    #fff0f7,
    #ffe0ed,
    #fff5f9
  );
  min-height: 100vh;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 24px 15px;
}

.header {
  text-align: center;
  padding: 38px 18px;
  border: 1px solid #ffd0e3;
  border-radius: 24px;
  background: rgba(255,255,255,.85);
  margin-bottom: 22px;
  box-shadow: 0 8px 25px #d987ad22;
}

.header h1 {
  color: #d84f91;
  font-size: 32px;
  margin: 0 0 10px;
}

.header p {
  color: #a45b7c;
  margin: 7px 0;
}

.hearts {
  font-size: 38px;
  margin-top: 14px;
}

.panel, .post {
  background: white;
  border: 1px solid #f5c4da;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 17px;
  box-shadow: 0 5px 18px #e9a9c626;
}

h2 {
  font-size: 20px;
  color: #c34f88;
  margin: 0 0 14px;
}

label {
  display: block;
  font-weight: bold;
  color: #b64d80;
  margin: 12px 0 7px;
}

input, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #edbad1;
  border-radius: 10px;
  font: inherit;
  background: #fffafd;
  color: #63394f;
}

textarea {
  height: 115px;
  resize: vertical;
}

button {
  background: #ed6ca6;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #d94f91;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.submit {
  width: 100%;
  margin-top: 14px;
}

.note {
  font-size: 12px;
  line-height: 1.6;
  color: #98788a;
  margin: 10px 0 0;
}

.post-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.target {
  font-weight: bold;
  color: #c34f88;
  font-size: 17px;
}

.anonymous {
  font-weight: bold;
  color: #d65394;
  margin-top: 13px;
  font-size: 16px;
}

.post-content {
  white-space: pre-wrap;
  line-height: 1.75;
  margin: 12px 0 16px;
}

.date {
  font-size: 12px;
  color: #a58d9a;
}

.comment-area {
  border-top: 1px dashed #efc4d8;
  padding-top: 10px;
}

.comment {
  background: #fff1f7;
  border-radius: 9px;
  padding: 10px;
  margin: 7px 0;
  white-space: pre-wrap;
  line-height: 1.5;
}

.comment-author {
  font-weight: bold;
  color: #bd5a8b;
  font-size: 13px;
  margin-bottom: 4px;
}

.comment-form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.comment-form input {
  flex: 1;
  min-width: 0;
}

.empty {
  text-align: center;
  padding: 25px;
  color: #a77791;
}

.footer {
  text-align: center;
  color: #bd5b8d;
  padding: 20px 10px;
}

.status {
  font-size: 13px;
  color: #b34d80;
  margin-top: 9px;
  min-height: 18px;
}

@media(max-width:560px) {
  .container {
    padding: 15px 11px;
  }

  .panel, .post {
    padding: 16px;
  }

  .comment-form {
    flex-wrap: wrap;
  }

  .comment-form input {
    flex-basis: 100%;
  }
}
</style>
</head>

<body>

<main class="container">

  <!-- 게시판 상단 -->
  <header class="header">

    <h1>💌 비밀스러운 고백 우체통</h1>

    <p>마음속에 담아두었던 이야기를 살며시 전해보세요.</p>

    <p>누구의 고백인지 알 수 없는 설레는 익명 공간 💗</p>

    <div class="hearts">💕 🧸 💕</div>

  </header>


  <!-- 고백 작성 -->
  <section class="panel">

    <h2>💗 익명으로 고백하기</h2>

    <form id="confessionForm">

      <label for="target">상대방 닉네임</label>

      <input
        id="target"
        type="text"
        maxlength="40"
        placeholder="고백하고 싶은 상대방 닉네임"
        required
      >

      <label for="content">고백 내용</label>

      <textarea
        id="content"
        maxlength="1500"
        placeholder="전하고 싶은 마음을 적어주세요 💕"
        required
      ></textarea>

      <button
        class="submit"
        id="submitButton"
        type="submit"
      >
        💌 익명으로 등록하기
      </button>

      <div
        class="status"
        id="formStatus"
        aria-live="polite"
      ></div>

    </form>

    <p class="note">
      상대방 닉네임과 고백 내용은 모든 회원에게 공개됩니다.
      작성자 이름은 입력받거나 게시판에 표시하지 않습니다.
    </p>

  </section>


  <!-- 고백 목록 -->
  <section id="postList" aria-live="polite">

    <div class="empty">
      고백을 불러오는 중입니다 💗
    </div>

  </section>


  <footer class="footer">
    💕 좋은 마음이 모여 행복한 모임이 되길 바라요 💕
  </footer>

</main>


<script>

// ===================================
// 1. Supabase 연결 설정
// ===================================

const SUPABASE_URL =
"https://vuvzchrhbdgtsfjoobrb.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1dnpjaHJoYmRndHNmam9vYnJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMTI2ODMsImV4cCI6MjExMDU4ODY4M30.sAQF8JeHkEp9XpFHVXDNg_GNane52lkxf0pH8PcnJNY";


const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("여기에_") &&
  !SUPABASE_ANON_KEY.includes("여기에_");


const db = configured
  ? window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    )
  : null;


const postList =
  document.getElementById("postList");

const formStatus =
  document.getElementById("formStatus");


// ===================================
// 2. HTML 보안 처리
// ===================================

function escapeHTML(value) {

  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char])
  );

}


function formatDate(value) {

  return new Date(value).toLocaleString(
    "ko-KR",
    {
      month: "numeric",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


// ===================================
// 3. 고백글 등록
// ===================================

document
.getElementById("confessionForm")
.addEventListener("submit", async function(event) {

  event.preventDefault();

  if (!db) {

    formStatus.textContent =
      "먼저 Supabase URL과 공개 키를 설정해 주세요.";

    return;

  }

  const target =
    document.getElementById("target").value.trim();

  const content =
    document.getElementById("content").value.trim();

  if (!target || !content) return;

  const button =
    document.getElementById("submitButton");

  button.disabled = true;

  formStatus.textContent = "등록 중입니다...";


  // 작성자 정보는 저장하지 않음

  const { error } = await db
    .from("confessions")
    .insert({
      target_nickname: target,
      content: content
    });


  button.disabled = false;


  if (error) {

    formStatus.textContent =
      "등록에 실패했습니다. 다시 시도해 주세요.";

    return;

  }


  this.reset();

  formStatus.textContent =
    "고백이 익명으로 등록되었습니다 💗";

  await loadPosts();

});


// ===================================
// 4. 전체 고백글 불러오기
// ===================================

async function loadPosts() {

  if (!db) {

    postList.innerHTML = `
      <div class="empty">
        Supabase 연결 정보가 아직 입력되지 않았습니다.<br>
        HTML 소스 위쪽의 URL과 공개 키를 설정해 주세요. 🌷
      </div>
    `;

    return;

  }


  const { data: posts, error } = await db
    .from("confessions")
    .select(
      "id,target_nickname,content,created_at"
    )
    .order("created_at", {
      ascending: false
    })
    .limit(100);


  if (error) {

    postList.innerHTML = `
      <div class="empty">
        게시글을 불러오지 못했습니다.
      </div>
    `;

    return;

  }


  if (!posts || posts.length === 0) {

    postList.innerHTML = `
      <div class="empty">
        아직 등록된 고백이 없어요.
        첫 번째 고백을 남겨주세요 💕
      </div>
    `;

    return;

  }


  // 댓글 불러오기

  const { data: comments } = await db
    .from("confession_comments")
    .select(
      "id,confession_id,content,created_at"
    )
    .in(
      "confession_id",
      posts.map(post => post.id)
    )
    .order("created_at", {
      ascending: true
    });


  const safeComments = comments || [];


  postList.innerHTML = posts.map(post => {

    const postComments =
      safeComments.filter(
        comment =>
          comment.confession_id === post.id
      );


    return `

      <article class="post">

        <div class="post-head">

          <span class="target">
            💗 상대방 : ${escapeHTML(post.target_nickname)}
          </span>

          <span class="date">
            ${formatDate(post.created_at)}
          </span>

        </div>


        <div class="anonymous">
          고백한 사람이 누군지 몰라요 💌
        </div>


        <div class="post-content">
          ${escapeHTML(post.content)}
        </div>


        <div class="comment-area">

          <strong>💬 익명 댓글</strong>

          <div id="comments-${post.id}">

            ${
              postComments.length

              ? postComments.map(comment => `

                <div class="comment">

                  <div class="comment-author">
                    익명
                  </div>

                  ${escapeHTML(comment.content)}

                  <div class="date">
                    ${formatDate(comment.created_at)}
                  </div>

                </div>

              `).join("")

              : `
                <div class="note">
                  아직 댓글이 없어요.
                  첫 댓글을 남겨보세요.
                </div>
              `
            }

          </div>


          <!-- 익명 댓글 작성 -->

          <form
            class="comment-form"
            data-post-id="${post.id}"
          >

            <input
              name="comment"
              maxlength="500"
              placeholder="익명 댓글을 남겨보세요 💕"
              required
            >

            <button type="submit">
              댓글 등록
            </button>

          </form>

        </div>

      </article>

    `;

  }).join("");


  // 댓글 등록 이벤트 연결

  document
    .querySelectorAll(".comment-form")
    .forEach(form => {

      form.addEventListener(
        "submit",
        addComment
      );

    });

}


// ===================================
// 5. 익명 댓글 등록
// ===================================

async function addComment(event) {

  event.preventDefault();

  if (!db) return;


  const form = event.currentTarget;

  const postId = form.dataset.postId;

  const content =
    form.elements.comment.value.trim();

  const button =
    form.querySelector("button");


  if (!content) return;

  button.disabled = true;


  // 댓글 작성자 정보 저장하지 않음

  const { error } = await db
    .from("confession_comments")
    .insert({

      confession_id: postId,

      content: content

    });


  button.disabled = false;


  if (error) {

    alert(
      "댓글 등록에 실패했습니다. 다시 시도해 주세요."
    );

    return;

  }


  await loadPosts();

}


// ===================================
// 6. 게시판 시작
// ===================================

loadPosts();

</script>

</body>
</html>
