
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리의 고백 게시판</title>

<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
:root{
  --pink:#f45ca6;
  --pink2:#ff8bc2;
  --deep:#9c2865;
  --pale:#fff0f7;
  --ink:#34203c;
  --muted:#8e8298;
  --line:#ffc2df;
  --white:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:"Pretendard",sans-serif;
  background:
    radial-gradient(circle at 8% 15%,rgba(255,255,255,.9) 0 2px,transparent 4px),
    radial-gradient(circle at 88% 25%,rgba(255,255,255,.8) 0 3px,transparent 5px),
    radial-gradient(circle at 20% 80%,rgba(255,255,255,.75) 0 2px,transparent 5px),
    linear-gradient(135deg,#ffd8e9 0%,#fff0f7 48%,#ffc8e2 100%);
  background-attachment:fixed;
}

.page{
  max-width:1240px;
  margin:auto;
  padding:0 24px 38px;
}

/* 상단 원본 배너 이미지 */
.hero{
  height:clamp(190px,18.3vw,240px);
  margin:0 -24px 0;
  padding:0;
  background-image:url("love_banner.jpg");
  background-repeat:no-repeat;
  background-position:center center;
  background-size:100% 100%;
}

/* 고백하기 제목 */
.section-tag{
  display:inline-block;
  background:#f45ca6;
  color:#fff;
  font-weight:800;
  border-radius:13px 13px 0 0;
  padding:8px 22px;
  margin-left:20px;
  box-shadow:0 2px 8px #e98ab8;
}

/* 작성 영역 */
.composer{
  background:rgba(255,255,255,.97);
  border:1.5px solid #ff9dcc;
  border-radius:17px;
  padding:20px 22px 17px;
  margin:0 0 12px;
  box-shadow:0 5px 18px rgba(220,95,155,.12);
}

.composer-top{
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.field-inline{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.field-inline label{
  font-size:14px;
  font-weight:800;
  color:#8f245f;
  white-space:nowrap;
}

.field-inline label:before{
  content:"♥";
  color:#f45ca6;
  margin-right:7px;
  font-size:17px;
}

input,textarea{
  font:inherit;
  color:var(--ink);
}

.composer input{
  width:275px;
  max-width:100%;
  border:1px solid #d8cbd8;
  border-radius:7px;
  padding:9px 12px;
  background:#fff;
  box-shadow:inset 0 1px 2px #eee;
}

.composer input:focus,
.composer textarea:focus,
.comment-form input:focus{
  outline:2px solid #ffd0e6;
  border-color:#f45ca6;
}

.composer-bottom{
  display:grid;
  grid-template-columns:minmax(0,1fr) 132px;
  gap:16px;
  align-items:center;
}

.composer textarea{
  width:100%;
  height:60px;
  resize:vertical;
  border:1.5px solid #ffadd3;
  border-radius:8px;
  padding:14px 17px;
  background:#fff;
  line-height:1.5;
}

::placeholder{color:#a69aaa}

.submit{
  height:60px;
  border:0;
  border-radius:13px;
  color:#fff;
  font-weight:800;
  font-size:16px;
  background:linear-gradient(135deg,#ff80bb,#f24d9d);
  box-shadow:0 3px 0 #e9a0c5;
}

.submit:hover{
  filter:brightness(.97);
  transform:translateY(-1px);
}

button{
  cursor:pointer;
  font-family:inherit;
}

button:disabled{
  opacity:.55;
  cursor:wait;
}

.status{
  text-align:center;
  min-height:18px;
  color:#b52e70;
  font-size:12px;
  margin-top:8px;
}

/* 게시글 목록 */
.posts{
  display:grid;
  gap:10px;
}

.post{
  display:grid;
  grid-template-columns:78px minmax(0,1fr);
  gap:16px;
  background:rgba(255,255,255,.97);
  border:1px solid #ffc0df;
  border-radius:16px;
  padding:15px 22px 12px;
  box-shadow:0 4px 14px rgba(215,105,157,.13);
}

.heart-count{
  width:72px;
  height:72px;
  border-radius:50% 50% 48% 48%;
  background:#ffe0ef;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ed3994;
  font-weight:900;
  font-size:22px;
  align-self:start;
  margin-top:1px;
}

.post-main{min-width:0}

.post-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:1px 0 5px;
}

.target{
  font-size:17px;
  font-weight:800;
  color:#38203e;
}

.date{
  font-size:12px;
  color:#8f829c;
  white-space:nowrap;
}

.post-content{
  white-space:pre-wrap;
  font-size:15px;
  line-height:1.55;
  margin:0 0 8px;
  overflow-wrap:anywhere;
}

.post-actions{text-align:right}

.delete-button{
  border:0;
  background:transparent;
  color:#a99aaa;
  font-size:11px;
  padding:3px 5px;
}

.admin-button{color:#bd347b}

/* 댓글 */
.comment-area{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.comment-count{
  font-size:12px;
  color:#8d8299;
  white-space:nowrap;
}

.comment-count:before{
  content:"▣";
  margin-right:5px;
}

.comment-form{
  display:flex;
  gap:6px;
  flex:1;
  min-width:0;
}

.comment-form input{
  min-width:0;
  flex:1;
  border:1px solid #f5c4dc;
  border-radius:7px;
  background:#fff3f9;
  padding:8px 12px;
  font-size:12px;
}

.comment-form button{
  border:0;
  border-radius:10px;
  padding:0 16px;
  background:#f66bab;
  color:white;
  font-size:12px;
  font-weight:800;
}

.comments{
  margin:8px 0 8px;
  padding:7px 10px;
  background:#fff7fb;
  border-radius:8px;
}

.comment{
  padding:5px 0;
  border-bottom:1px solid #f8e1ed;
}

.comment:last-child{border:0}

.comment-top{
  display:flex;
  justify-content:space-between;
  color:#9c3972;
  font-size:11px;
  margin-bottom:3px;
}

.comment-content{
  font-size:12px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.comment-actions{text-align:right}

.comment-empty{display:none}

.empty{
  text-align:center;
  background:#fff;
  border:1px solid #ffc0df;
  border-radius:16px;
  padding:35px;
  color:#9b7c91;
}

/* 하단 */
.footer{
  text-align:center;
  color:#c33b80;
  font:700 20px "Gaegu",cursive;
  padding:20px 0 5px;
}

.admin-area{
  margin-top:14px;
  font-family:"Pretendard",sans-serif;
}

.admin-login{
  background:transparent;
  border:0;
  color:#a88b9b;
  font-size:10px;
  padding:5px;
}

.admin-state{
  font-size:11px;
  color:#b52e70;
}

/* 모바일 */
@media(max-width:720px){
  .page{padding:0 12px 28px}

  .hero{
    margin:0 -12px 0;
    height:175px;
    background-size:auto 100%;
    background-position:center center;
  }

  .composer{padding:16px 14px}
  .composer-top{gap:12px}
  .composer input{width:190px}
  .composer-bottom{grid-template-columns:1fr}
  .composer textarea{height:75px}
  .submit{height:48px}

  .post{
    grid-template-columns:54px minmax(0,1fr);
    gap:10px;
    padding:13px 12px;
  }

  .heart-count{
    width:52px;
    height:52px;
    font-size:17px;
  }

  .comment-area{flex-wrap:wrap}
  .comment-form{flex-basis:100%}
}

@media(max-width:420px){
  .hero{
    height:145px;
    background-size:auto 100%;
    background-position:center center;
  }

  .composer-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .composer input{width:100%}
  .field-inline{width:100%}

  .post-head{
    align-items:flex-start;
    flex-direction:column;
    gap:3px;
  }

  .post-content{font-size:14px}
  .comment-form button{padding:0 11px}
}
</style>
</head>

<body>
<main class="page">

  <!-- 첨부 이미지에서 잘라낸 실제 배너 -->
  <header
    class="hero"
    role="img"
    aria-label="곰돌이와 하트가 있는 우리의 고백 게시판 배너">
  </header>

  <div class="section-tag">♥ 고백하기</div>

  <!-- 고백 작성 -->
  <section class="composer">
    <form id="confessionForm">

      <div class="composer-top">

        <div class="field-inline">
          <label for="target">상대방 닉네임</label>
          <input
            id="target"
            type="text"
            maxlength="40"
            placeholder="예) 그사람, 내짝꿍 등"
            required>
        </div>

        <div class="field-inline">
          <label for="content">고백 내용</label>
        </div>

      </div>

      <div class="composer-bottom">

        <textarea
          id="content"
          maxlength="1500"
          placeholder="하고 싶은 말을 적어주세요... 💕"
          required></textarea>

        <button
          class="submit"
          id="submitButton"
          type="submit">
          ✎ 등록하기
        </button>

      </div>

      <div
        class="status"
        id="formStatus"
        aria-live="polite">
      </div>

    </form>
  </section>

  <!-- 게시글 목록 -->
  <section
    id="postList"
    class="posts"
    aria-live="polite">

    <div class="empty">
      고백을 불러오고 있습니다...
    </div>

  </section>

  <!-- 하단 -->
  <footer class="footer">

    💗 좋은 마음이 모여 더 따뜻한 모임이 되길 바라요 💗

    <div class="admin-area">

      <span id="adminState" class="admin-state"></span>

      <button
        id="adminLoginButton"
        class="admin-login"
        type="button">
        관리자 모드
      </button>

      <button
        id="adminLogoutButton"
        class="admin-login"
        type="button"
        style="display:none">
        관리자 모드 종료
      </button>

    </div>

  </footer>

</main>

<script>

// ===================================
// 1. Supabase 연결
// ===================================

const SUPABASE_URL =
"https://vuvzchrhbdgtsfjoobrb.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_E0GSkkS2vp-oknFC9nfvAg_Ky-JhpBH";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const postList = document.getElementById("postList");
const formStatus = document.getElementById("formStatus");

let isAdmin = false;
let adminPassword = "";


// ===================================
// 2. 공통 함수
// ===================================

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function formatDate(value) {
  return new Date(value).toLocaleString("ko-KR", {
    month:"long",
    day:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}


// ===================================
// 3. 게시글 작성
// ===================================

document.getElementById("confessionForm")
.addEventListener("submit", async function(event) {

  event.preventDefault();

  const target =
    document.getElementById("target").value.trim();

  const content =
    document.getElementById("content").value.trim();

  if (!target || !content) {
    formStatus.textContent =
      "닉네임과 고백 내용을 입력해 주세요.";
    return;
  }

  const password = prompt(
    "본인 삭제에 사용할 비밀번호를 설정해 주세요. (4자 이상)"
  );

  if (password === null) return;

  if (password.length < 4) {
    formStatus.textContent =
      "비밀번호는 4자 이상 입력해 주세요.";
    return;
  }

  const button =
    document.getElementById("submitButton");

  button.disabled = true;

  formStatus.textContent =
    "고백을 등록하고 있습니다...";

  try {

    const { error } = await db.rpc(
      "create_confession",
      {
        p_target_nickname:target,
        p_content:content,
        p_password:password
      }
    );

    if (error) throw error;

    this.reset();

    formStatus.textContent =
      "고백이 등록되었습니다. 💗";

    await loadPosts();

  } catch (error) {

    console.error(error);

    formStatus.textContent =
      "등록에 실패했습니다. Supabase 설정을 확인해 주세요.";

  } finally {

    button.disabled = false;

  }

});


// ===================================
// 4. 게시글 불러오기
// ===================================

async function loadPosts() {

  const { data:posts, error } = await db
    .from("confessions")
    .select("id,target_nickname,content,created_at")
    .order("created_at",{ascending:false})
    .limit(100);

  if (error) {

    console.error(error);

    postList.innerHTML =
      '<div class="empty">게시글을 불러오지 못했습니다.</div>';

    return;
  }

  if (!posts || posts.length === 0) {

    postList.innerHTML = `
      <div class="empty">
        아직 도착한 고백이 없어요.<br>
        첫 번째 마음을 전해보세요 💗
      </div>
    `;

    return;
  }

  const ids = posts.map(p => p.id);

  const { data:comments, error:commentError } = await db
    .from("confession_comments")
    .select("id,confession_id,content,created_at")
    .in("confession_id",ids)
    .order("created_at",{ascending:true});

  if (commentError) console.error(commentError);

  const safeComments = comments || [];

  postList.innerHTML = posts.map(post => {

    const list = safeComments.filter(
      c => c.confession_id === post.id
    );

    return `
      <article class="post">

        <div class="heart-count">♡</div>

        <div class="post-main">

          <div class="post-head">

            <span class="target">
              ${escapeHTML(post.target_nickname)}
            </span>

            <span class="date">
              ◷ ${formatDate(post.created_at)}
            </span>

          </div>

          <p class="post-content">
            ${escapeHTML(post.content)}
          </p>

          <div class="post-actions">

            <button
              class="delete-button"
              type="button"
              onclick="deletePost('${post.id}')">
              본인 삭제
            </button>

            ${isAdmin ? `
              <button
                class="delete-button admin-button"
                type="button"
                onclick="adminDelete('post','${post.id}')">
                관리자 삭제
              </button>
            ` : ""}

          </div>

          <div class="comments">

            ${list.map(c => `

              <div class="comment">

                <div class="comment-top">
                  <span>익명</span>
                  <span>${formatDate(c.created_at)}</span>
                </div>

                <div class="comment-content">
                  ${escapeHTML(c.content)}
                </div>

                <div class="comment-actions">

                  <button
                    class="delete-button"
                    type="button"
                    onclick="deleteComment('${c.id}')">
                    본인 삭제
                  </button>

                  ${isAdmin ? `
                    <button
                      class="delete-button admin-button"
                      type="button"
                      onclick="adminDelete('comment','${c.id}')">
                      관리자 삭제
                    </button>
                  ` : ""}

                </div>

              </div>

            `).join("")}

          </div>

          <div class="comment-area">

            <span class="comment-count">
              댓글 ${list.length}개
            </span>

            <form
              class="comment-form"
              data-post-id="${post.id}">

              <input
                name="comment"
                maxlength="500"
                placeholder="댓글을 입력해보세요..."
                required>

              <button type="submit">
                등록
              </button>

            </form>

          </div>

        </div>

      </article>
    `;

  }).join("");

  document.querySelectorAll(".comment-form")
    .forEach(form => {
      form.addEventListener("submit",addComment);
    });

}


// ===================================
// 5. 댓글 작성
// ===================================

async function addComment(event) {

  event.preventDefault();

  const form = event.currentTarget;

  const content =
    form.elements.comment.value.trim();

  if (!content) return;

  const password = prompt(
    "댓글 삭제에 사용할 비밀번호를 입력해 주세요. (4자 이상)"
  );

  if (password === null) return;

  if (password.length < 4) {
    alert("비밀번호는 4자 이상 입력해 주세요.");
    return;
  }

  const button = form.querySelector("button");

  button.disabled = true;

  try {

    const { error } = await db.rpc(
      "create_comment",
      {
        p_confession_id:form.dataset.postId,
        p_content:content,
        p_password:password
      }
    );

    if (error) throw error;

    await loadPosts();

  } catch(error) {

    console.error(error);

    alert("댓글 등록에 실패했습니다. 다시 시도해 주세요.");

    button.disabled = false;

  }

}


// ===================================
// 6. 본인 게시글 삭제
// ===================================

async function deletePost(postId) {

  const password = prompt(
    "게시글 작성 시 설정한 삭제 비밀번호를 입력해 주세요."
  );

  if (password === null) return;

  if (!password) {
    alert("비밀번호를 입력해 주세요.");
    return;
  }

  if (!confirm("이 게시글과 댓글을 모두 삭제할까요?")) return;

  try {

    const { data,error } = await db.rpc(
      "delete_confession",
      {
        p_confession_id:postId,
        p_password:password
      }
    );

    if (error) throw error;

    if (data !== true) {
      alert("비밀번호가 일치하지 않거나 삭제할 수 없는 게시글입니다.");
      return;
    }

    alert("게시글이 삭제되었습니다.");

    await loadPosts();

  } catch(error) {

    console.error(error);

    alert("게시글 삭제에 실패했습니다.");

  }

}


// ===================================
// 7. 본인 댓글 삭제
// ===================================

async function deleteComment(commentId) {

  const password = prompt(
    "댓글 작성 시 설정한 삭제 비밀번호를 입력해 주세요."
  );

  if (password === null) return;

  if (!password) {
    alert("비밀번호를 입력해 주세요.");
    return;
  }

  if (!confirm("이 댓글을 삭제할까요?")) return;

  try {

    const { data,error } = await db.rpc(
      "delete_comment",
      {
        p_comment_id:commentId,
        p_password:password
      }
    );

    if (error) throw error;

    if (data !== true) {
      alert("비밀번호가 일치하지 않거나 삭제할 수 없는 댓글입니다.");
      return;
    }

    alert("댓글이 삭제되었습니다.");

    await loadPosts();

  } catch(error) {

    console.error(error);

    alert("댓글 삭제에 실패했습니다.");

  }

}


// ===================================
// 8. 관리자 모드 로그인
// ===================================

document.getElementById("adminLoginButton")
.addEventListener("click",async function() {

  const password = prompt(
    "관리자 비밀번호를 입력해 주세요."
  );

  if (password === null) return;

  if (!password) {
    alert("관리자 비밀번호를 입력해 주세요.");
    return;
  }

  try {

    const { data,error } = await db.functions.invoke(
      "admin-delete",
      {
        body:{
          type:"verify",
          password
        }
      }
    );

    if (error) throw error;

    if (!data || !data.success) {
      alert(data?.error || "관리자 인증에 실패했습니다.");
      return;
    }

    isAdmin = true;
    adminPassword = password;

    document.getElementById("adminLoginButton").style.display =
      "none";

    document.getElementById("adminLogoutButton").style.display =
      "inline-block";

    document.getElementById("adminState").textContent =
      "관리자 모드 활성화";

    await loadPosts();

  } catch(error) {

    console.error(error);

    alert(
      "관리자 인증에 실패했습니다. Edge Function 설정을 확인해 주세요."
    );

  }

});


// ===================================
// 9. 관리자 모드 종료
// ===================================

document.getElementById("adminLogoutButton")
.addEventListener("click",async function() {

  isAdmin = false;
  adminPassword = "";

  document.getElementById("adminLoginButton").style.display =
    "inline-block";

  document.getElementById("adminLogoutButton").style.display =
    "none";

  document.getElementById("adminState").textContent = "";

  await loadPosts();

});


// ===================================
// 10. 관리자 게시글 및 댓글 삭제
// ===================================

async function adminDelete(type,id) {

  if (!isAdmin || !adminPassword) {
    alert("관리자 인증이 필요합니다.");
    return;
  }

  const name =
    type === "post" ? "게시글과 해당 댓글" : "댓글";

  if (!confirm(
    `관리자 권한으로 ${name}을(를) 삭제할까요?`
  )) return;

  try {

    const { data,error } = await db.functions.invoke(
      "admin-delete",
      {
        body:{
          type,
          id,
          password:adminPassword
        }
      }
    );

    if (error) throw error;

    if (!data || !data.success) {
      alert(data?.error || "관리자 삭제에 실패했습니다.");
      return;
    }

    alert("관리자 권한으로 삭제되었습니다.");

    await loadPosts();

  } catch(error) {

    console.error(error);

    alert(
      "관리자 삭제에 실패했습니다. Edge Function 설정을 확인해 주세요."
    );

  }

}


// ===================================
// 11. 게시판 시작
// ===================================

loadPosts();

</script>
