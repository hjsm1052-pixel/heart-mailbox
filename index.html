<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀스러운 고백</title>

<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
:root {
  --bg-page:#F8F6F2;
  --bg-card:#FFFFFF;
  --text-primary:#22201E;
  --text-secondary:#68635E;
  --text-muted:#9B958E;
  --accent:#9C4A5B;
  --accent-hover:#823A49;
  --accent-soft:#F7ECEE;
  --border-light:#E8E3DC;
  --shadow-card:0 4px 20px rgba(34,32,30,.04);
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  color:var(--text-primary);
  background:var(--bg-page);
  min-height:100vh;
}
.container {max-width:720px;margin:auto;padding:48px 20px 64px}
.header {
  text-align:center;padding:44px 24px;background:white;
  border:1px solid var(--border-light);border-radius:16px;
  margin-bottom:32px;box-shadow:var(--shadow-card)
}
.header h1 {
  font-family:"Noto Serif KR",serif;font-size:28px;
  margin:0 0 14px;font-weight:600
}
.header p {color:var(--text-secondary);font-size:14.5px;line-height:1.65;margin:4px 0}
.section-divider {display:flex;justify-content:space-between;margin:0 4px 16px}
.section-title {font-size:13px;font-weight:600;color:var(--text-secondary)}
.panel,.post {
  background:white;border:1px solid var(--border-light);
  border-radius:14px;padding:28px;margin-bottom:18px;
  box-shadow:var(--shadow-card)
}
.panel {margin-top:36px}
.panel h2 {
  font-family:"Noto Serif KR",serif;font-size:20px;margin:0 0 6px
}
.panel-sub {font-size:13.5px;color:var(--text-secondary);margin:0 0 22px}
.post-head {
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding-bottom:16px;border-bottom:1px solid var(--border-light)
}
.target-badge {
  display:inline-flex;gap:6px;font-size:14px;font-weight:600;
  color:var(--accent);background:var(--accent-soft);
  padding:5px 12px;border-radius:999px
}
.target-badge span {font-size:12px;font-weight:400}
.date,.comment-date {font-size:12px;color:var(--text-muted)}
.post-content {
  white-space:pre-wrap;font-size:15.5px;line-height:1.8;
  margin:20px 0 24px;word-break:keep-all
}
.comment-area {background:var(--bg-page);border-radius:10px;padding:18px}
.comment-header {font-size:12.5px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:12px}
.comment {
  background:white;border:1px solid var(--border-light);
  border-radius:8px;padding:12px 14px;margin-bottom:8px;
  font-size:14px;line-height:1.6;white-space:pre-wrap
}
.comment-top {display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.comment-author {font-weight:600;color:var(--text-secondary);font-size:12px}
.comment-empty {font-size:13px;color:var(--text-muted);margin:4px 0 12px}
.comment-form {display:flex;gap:8px;margin-top:12px}
.comment-form input {flex:1;min-width:0;padding:10px 14px;font-size:13.5px}
.comment-form button {padding:10px 16px;font-size:13.5px}
label {display:block;font-size:13px;font-weight:600;margin:16px 0 8px}
input,textarea {
  width:100%;padding:13px 15px;border:1px solid var(--border-light);
  border-radius:10px;font:inherit;font-size:14.5px;
  background:var(--bg-page);color:var(--text-primary)
}
input:focus,textarea:focus {outline:none;border-color:var(--accent);background:white}
textarea {height:130px;resize:vertical;line-height:1.65}
button {
  background:var(--accent);color:white;border:0;border-radius:10px;
  padding:13px 20px;font-family:inherit;font-weight:600;
  font-size:14px;cursor:pointer
}
button:hover {background:var(--accent-hover)}
button:disabled {opacity:.55;cursor:wait}
.submit {width:100%;margin-top:20px;padding:15px;font-size:15px}
.delete-button {
  background:transparent;color:#9B958E;border:1px solid var(--border-light);
  padding:4px 9px;font-size:11px;border-radius:6px
}
.delete-button:hover {background:var(--accent-soft);color:var(--accent)}
.comment-delete {font-size:10px;padding:3px 7px}
.note {font-size:12.5px;line-height:1.6;color:var(--text-muted);margin:14px 0 0;text-align:center}
.status {font-size:13.5px;color:var(--accent);margin-top:12px;text-align:center;min-height:20px}
.empty {
  text-align:center;padding:48px 20px;background:white;
  border:1px solid var(--border-light);border-radius:14px;
  color:var(--text-muted);font-size:14.5px;line-height:1.6
}
.footer {text-align:center;color:var(--text-muted);font-size:13px;padding:32px 10px 0}
@media(max-width:560px) {
  .container {padding:24px 14px 48px}
  .header {padding:32px 18px}
  .header h1 {font-size:24px}
  .panel,.post {padding:20px}
  .comment-form {flex-direction:column}
  .comment-form button {width:100%}
  .post-head {align-items:flex-start}
}
</style>
</head>

<body>
<main class="container">

  <header class="header">
    <h1>비밀스러운 고백 우체통</h1>
    <p>마음속에 오래 담아두었던 진심을 조용히 건네보세요.</p>
    <p>보내는 이의 흔적 없이 오직 마음만 전달되는 익명 공간입니다.</p>
  </header>

  <div class="section-divider">
    <span class="section-title">전달된 마음들</span>
  </div>

  <section id="postList" aria-live="polite">
    <div class="empty">우체통을 열어보는 중입니다...</div>
  </section>

  <section class="panel">
    <h2>익명으로 마음 전하기</h2>
    <p class="panel-sub">작성자 정보는 공개하지 않습니다.</p>

    <form id="confessionForm">
      <label for="target">받는 사람</label>
      <input id="target" type="text" maxlength="40"
        placeholder="마음을 전하고 싶은 상대방의 닉네임" required>

      <label for="content">전하고 싶은 이야기</label>
      <textarea id="content" maxlength="1500"
        placeholder="평소 건네지 못했던 진심을 차분히 적어보세요." required></textarea>

      <label for="postPassword">삭제 비밀번호</label>
      <input id="postPassword" type="password" minlength="4"
        maxlength="50" autocomplete="new-password"
        placeholder="나중에 삭제할 때 사용할 비밀번호 (4자 이상)" required>

      <button class="submit" id="submitButton" type="submit">마음 전하기</button>
      <div class="status" id="formStatus" aria-live="polite"></div>
    </form>

    <p class="note">
      닉네임과 고백 내용은 공개됩니다. 삭제 비밀번호는 공개되지 않으니 꼭 기억해 주세요.
    </p>
  </section>

  <footer class="footer">
    서로의 진심이 모여 따뜻한 인연이 되기를 바랍니다.
  </footer>

</main>

<script>
// ===================================
// 1. Supabase 연결
// ===================================

const SUPABASE_URL =
"https://vuvzchrhbdgtsfjoobrb.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_E0GSkkS2vp-oknFC9nfvAg_Ky-JhpBH";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const postList = document.getElementById("postList");
const formStatus = document.getElementById("formStatus");


// ===================================
// 2. HTML 보안 처리
// ===================================

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function formatDate(value) {
  return new Date(value).toLocaleString("ko-KR", {
    month:"long",
    day:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}


// ===================================
// 3. 게시글 작성
// ===================================

document.getElementById("confessionForm")
.addEventListener("submit", async function(event) {

  event.preventDefault();

  const target = document.getElementById("target").value.trim();
  const content = document.getElementById("content").value.trim();
  const password = document.getElementById("postPassword").value;

  if (!target || !content || password.length < 4) {
    formStatus.textContent = "모든 항목을 정확히 입력해 주세요.";
    return;
  }

  const button = document.getElementById("submitButton");
  button.disabled = true;
  formStatus.textContent = "편지를 전달하고 있습니다...";

  try {
    const { error } = await db.rpc("create_confession", {
      p_target_nickname: target,
      p_content: content,
      p_password: password
    });

    if (error) throw error;

    this.reset();
    formStatus.textContent = "마음이 안전하게 전달되었습니다.";
    await loadPosts();

  } catch (error) {
    console.error(error);
    formStatus.textContent =
      "등록에 실패했습니다. 잠시 후 다시 시도해 주세요.";
  } finally {
    button.disabled = false;
  }
});


// ===================================
// 4. 게시글 불러오기
// ===================================

async function loadPosts() {

  const { data: posts, error } = await db
    .from("confessions")
    .select("id,target_nickname,content,created_at")
    .order("created_at", { ascending:false })
    .limit(100);

  if (error) {
    console.error(error);
    postList.innerHTML = `
      <div class="empty">게시글을 불러오지 못했습니다.</div>
    `;
    return;
  }

  if (!posts || posts.length === 0) {
    postList.innerHTML = `
      <div class="empty">
        아직 도착한 편지가 없습니다.<br>
        첫 번째 이야기를 남겨보세요.
      </div>
    `;
    return;
  }

  const postIds = posts.map(post => post.id);

  const { data: comments, error: commentError } = await db
    .from("confession_comments")
    .select("id,confession_id,content,created_at")
    .in("confession_id", postIds)
    .order("created_at", { ascending:true });

  if (commentError) {
    console.error(commentError);
  }

  const safeComments = comments || [];

  postList.innerHTML = posts.map(post => {

    const postComments = safeComments.filter(
      comment => comment.confession_id === post.id
    );

    return `
      <article class="post">

        <div class="post-head">
          <span class="target-badge">
            <span>To.</span>
            ${escapeHTML(post.target_nickname)}
          </span>

          <span class="date">${formatDate(post.created_at)}</span>
        </div>

        <div class="post-content">${escapeHTML(post.content)}</div>

        <div style="text-align:right;margin-bottom:15px">
          <button class="delete-button"
            type="button"
            onclick="deletePost('${post.id}')">
            게시글 삭제
          </button>
        </div>

        <div class="comment-area">

          <span class="comment-header">
            답장 및 댓글 (${postComments.length})
          </span>

          <div>
            ${
              postComments.length
              ? postComments.map(comment => `
                <div class="comment">

                  <div class="comment-top">
                    <span class="comment-author">익명</span>
                    <span class="comment-date">
                      ${formatDate(comment.created_at)}
                    </span>
                  </div>

                  <div>${escapeHTML(comment.content)}</div>

                  <div style="text-align:right;margin-top:7px">
                    <button class="delete-button comment-delete"
                      type="button"
                      onclick="deleteComment('${comment.id}')">
                      삭제
                    </button>
                  </div>

                </div>
              `).join("")
              : `
                <div class="comment-empty">
                  아직 남겨진 답장이 없습니다.
                </div>
              `
            }
          </div>

          <form class="comment-form" data-post-id="${post.id}">
            <input name="comment" maxlength="500"
              placeholder="따뜻한 답장을 남겨보세요" required>

            <input name="password" type="password"
              minlength="4" maxlength="50"
              autocomplete="new-password"
              placeholder="삭제 비밀번호 (4자 이상)" required>

            <button type="submit">등록</button>
          </form>

        </div>
      </article>
    `;
  }).join("");

  document.querySelectorAll(".comment-form")
    .forEach(form => {
      form.addEventListener("submit", addComment);
    });
}


// ===================================
// 5. 댓글 작성
// ===================================

async function addComment(event) {

  event.preventDefault();

  const form = event.currentTarget;
  const postId = form.dataset.postId;
  const content = form.elements.comment.value.trim();
  const password = form.elements.password.value;
  const button = form.querySelector("button");

  if (!content || password.length < 4) {
    alert("댓글과 삭제 비밀번호를 입력해 주세요.");
    return;
  }

  button.disabled = true;

  try {
    const { error } = await db.rpc("create_comment", {
      p_confession_id: postId,
      p_content: content,
      p_password: password
    });

    if (error) throw error;

    await loadPosts();

  } catch (error) {
    console.error(error);
    alert("댓글 등록에 실패했습니다. 다시 시도해 주세요.");
    button.disabled = false;
  }
}


// ===================================
// 6. 게시글 삭제
// ===================================

async function deletePost(postId) {

  const password = prompt(
    "게시글 작성 시 설정한 삭제 비밀번호를 입력해 주세요."
  );

  if (password === null) return;

  if (!password) {
    alert("비밀번호를 입력해 주세요.");
    return;
  }

  if (!confirm("이 게시글과 댓글을 모두 삭제할까요?")) return;

  try {
    const { data, error } = await db.rpc("delete_confession", {
      p_confession_id: postId,
      p_password: password
    });

    if (error) throw error;

    if (data !== true) {
      alert("비밀번호가 일치하지 않거나 삭제할 수 없는 게시글입니다.");
      return;
    }

    alert("게시글이 삭제되었습니다.");
    await loadPosts();

  } catch (error) {
    console.error(error);
    alert("게시글 삭제에 실패했습니다.");
  }
}


// ===================================
// 7. 댓글 삭제
// ===================================

async function deleteComment(commentId) {

  const password = prompt(
    "댓글 작성 시 설정한 삭제 비밀번호를 입력해 주세요."
  );

  if (password === null) return;

  if (!password) {
    alert("비밀번호를 입력해 주세요.");
    return;
  }

  if (!confirm("이 댓글을 삭제할까요?")) return;

  try {
    const { data, error } = await db.rpc("delete_comment", {
      p_comment_id: commentId,
      p_password: password
    });

    if (error) throw error;

    if (data !== true) {
      alert("비밀번호가 일치하지 않거나 삭제할 수 없는 댓글입니다.");
      return;
    }

    alert("댓글이 삭제되었습니다.");
    await loadPosts();

  } catch (error) {
    console.error(error);
    alert("댓글 삭제에 실패했습니다.");
  }
}


// ===================================
// 8. 게시판 시작
// ===================================

loadPosts();

</script>
</body>
</html>
