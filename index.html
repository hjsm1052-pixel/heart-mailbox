<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀스러운 고백 우체통</title>

<!-- 세련된 한글 웹폰트 (Pretendard & Noto Serif KR) -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
:root {
  --bg-page: #F8F6F2;
  --bg-card: #FFFFFF;
  --bg-subtle: #F3EFEA;
  --text-primary: #22201E;
  --text-secondary: #68635E;
  --text-muted: #9B958E;
  --accent: #9C4A5B;
  --accent-hover: #823A49;
  --accent-soft: #F7ECEE;
  --border-light: #E8E3DC;
  --shadow-card: 0 4px 20px rgba(34, 32, 30, 0.04);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
  color: var(--text-primary);
  background-color: var(--bg-page);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 48px 20px 64px;
}

/* 상단 헤더 */
.header {
  text-align: center;
  padding: 44px 24px;
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: 16px;
  margin-bottom: 32px;
  box-shadow: var(--shadow-card);
}

.header-eyebrow {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}

.header h1 {
  font-family: "Noto Serif KR", serif;
  color: var(--text-primary);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0 0 14px;
}

.header p {
  color: var(--text-secondary);
  font-size: 14.5px;
  line-height: 1.65;
  margin: 4px 0;
}

/* 섹션 구분 타이틀 */
.section-divider {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 4px 16px;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
}

/* 카드 공통 (게시글 & 작성 폼) */
.panel, .post {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: 14px;
  padding: 28px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-card);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.post:hover {
  box-shadow: 0 8px 28px rgba(34, 32, 30, 0.06);
}

/* 게시글 카드 내부 */
.post-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-light);
}

.target-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 5px 12px;
  border-radius: 999px;
}

.target-badge span {
  font-weight: 400;
  font-size: 12px;
  opacity: 0.85;
}

.date {
  font-size: 12.5px;
  color: var(--text-muted);
}

.post-content {
  white-space: pre-wrap;
  font-size: 15.5px;
  line-height: 1.8;
  color: var(--text-primary);
  margin: 20px 0 24px;
  word-break: keep-all;
}

/* 댓글 영역 */
.comment-area {
  background: var(--bg-page);
  border-radius: 10px;
  padding: 18px;
}

.comment-header {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: block;
}

.comment {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 8px;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.comment-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.comment-author {
  font-weight: 600;
  color: var(--text-secondary);
  font-size: 12px;
}

.comment-date {
  font-size: 11.5px;
  color: var(--text-muted);
}

.comment-empty {
  font-size: 13px;
  color: var(--text-muted);
  margin: 4px 0 12px;
}

.comment-form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.comment-form input {
  flex: 1;
  min-width: 0;
  padding: 10px 14px;
  font-size: 13.5px;
  background: var(--bg-card);
}

.comment-form button {
  padding: 10px 16px;
  font-size: 13.5px;
  white-space: nowrap;
}

/* 작성 폼 영역 */
.panel {
  margin-top: 36px;
}

.panel h2 {
  font-family: "Noto Serif KR", serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0 0 6px;
}

.panel-sub {
  font-size: 13.5px;
  color: var(--text-secondary);
  margin: 0 0 22px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 16px 0 8px;
}

input, textarea {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid var(--border-light);
  border-radius: 10px;
  font: inherit;
  font-size: 14.5px;
  background: var(--bg-page);
  color: var(--text-primary);
  transition: border-color 0.2s ease, background-color 0.2s ease;
}

input::placeholder, textarea::placeholder {
  color: var(--text-muted);
}

input:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-card);
}

textarea {
  height: 130px;
  resize: vertical;
  line-height: 1.65;
}

button {
  background: var(--accent);
  color: #FFFFFF;
  border: 0;
  border-radius: 10px;
  padding: 13px 20px;
  font-family: inherit;
  font-weight: 600;
  font-size: 14.5px;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

button:hover {
  background: var(--accent-hover);
}

button:disabled {
  opacity: 0.55;
  cursor: wait;
}

.submit {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  font-size: 15px;
}

.note {
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text-muted);
  margin: 14px 0 0;
  text-align: center;
}

.status {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--accent);
  margin-top: 12px;
  text-align: center;
  min-height: 20px;
}

.empty {
  text-align: center;
  padding: 48px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: 14px;
  color: var(--text-muted);
  font-size: 14.5px;
  line-height: 1.6;
}

.footer {
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  padding: 32px 10px 0;
  letter-spacing: -0.01em;
}

@media (max-width: 560px) {
  .container {
    padding: 24px 14px 48px;
  }

  .header {
    padding: 32px 18px;
  }

  .header h1 {
    font-size: 24px;
  }

  .panel, .post {
    padding: 20px;
  }

  .comment-form {
    flex-direction: column;
  }

  .comment-form button {
    width: 100%;
  }
}
</style>
</head>

<body>

<main class="container">

  <!-- 게시판 상단 -->
  <header class="header">
    <span class="header-eyebrow">Secret Mailbox</span>
    <h1>비밀스러운 고백 우체통</h1>
    <p>마음속에 오래 담아두었던 진심을 조용히 건네보세요.</p>
    <p>보내는 이의 흔적 없이 오직 마음만 전달되는 익명 공간입니다.</p>
  </header>

  <!-- 고백 목록 -->
  <div class="section-divider">
    <span class="section-title">전달된 마음들</span>
  </div>

  <section id="postList" aria-live="polite">
    <div class="empty">
      우체통을 열어보는 중입니다...
    </div>
  </section>

  <!-- 고백 작성 -->
  <section class="panel">
    <h2>익명으로 마음 전하기</h2>
    <p class="panel-sub">작성자의 어떠한 정보도 기록되거나 공개되지 않습니다.</p>

    <form id="confessionForm">
      <label for="target">받는 사람</label>
      <input
        id="target"
        type="text"
        maxlength="40"
        placeholder="마음을 전하고 싶은 상대방의 닉네임"
        required
      >

      <label for="content">전하고 싶은 이야기</label>
      <textarea
        id="content"
        maxlength="1500"
        placeholder="평소 건네지 못했던 진심을 차분히 적어보세요."
        required
      ></textarea>

      <button
        class="submit"
        id="submitButton"
        type="submit"
      >
        우체통에 편지 넣기
      </button>

      <div
        class="status"
        id="formStatus"
        aria-live="polite"
      ></div>
    </form>

    <p class="note">
      등록된 닉네임과 내용은 게시판에 공개되며, 작성자 정보는 수집하지 않습니다.
    </p>
  </section>

  <footer class="footer">
    서로의 진심이 모여 따뜻한 인연이 되기를 바랍니다.
  </footer>

</main>

<script>
// ===================================
// 1. Supabase 연결 설정
// ===================================

const SUPABASE_URL =
"https://vuvzchrhbdgtsfjoobrb.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_E0GSkkS2vp-oknFC9nfvAg_Ky-JhpBH";

const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("여기에_") &&
  !SUPABASE_ANON_KEY.includes("여기에_");

const db = configured
  ? window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    )
  : null;

const postList = document.getElementById("postList");
const formStatus = document.getElementById("formStatus");

// ===================================
// 2. HTML 보안 처리
// ===================================

function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char])
  );
}

function formatDate(value) {
  return new Date(value).toLocaleString(
    "ko-KR",
    {
      month: "long",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

// ===================================
// 3. 고백글 등록
// ===================================

document
.getElementById("confessionForm")
.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!db) {
    formStatus.textContent =
      "먼저 Supabase URL과 공개 키를 설정해 주세요.";
    return;
  }

  const target = document.getElementById("target").value.trim();
  const content = document.getElementById("content").value.trim();

  if (!target || !content) return;

  const button = document.getElementById("submitButton");
  button.disabled = true;
  formStatus.textContent = "편지를 전달하고 있습니다...";

  const { error } = await db
    .from("confessions")
    .insert({
      target_nickname: target,
      content: content
    });

  button.disabled = false;

  if (error) {
    formStatus.textContent =
      "등록에 실패했습니다. 잠시 후 다시 시도해 주세요.";
    return;
  }

  this.reset();
  formStatus.textContent =
    "마음이 안전하게 전달되었습니다.";

  await loadPosts();
});

// ===================================
// 4. 전체 고백글 불러오기
// ===================================

async function loadPosts() {
  if (!db) {
    postList.innerHTML = `
      <div class="empty">
        Supabase 연결 정보가 아직 입력되지 않았습니다.<br>
        HTML 소스 위쪽의 URL과 공개 키를 설정해 주세요.
      </div>
    `;
    return;
  }

  const { data: posts, error } = await db
    .from("confessions")
    .select("id,target_nickname,content,created_at")
    .order("created_at", { ascending: false })
    .limit(100);

  if (error) {
    postList.innerHTML = `
      <div class="empty">
        게시글을 불러오지 못했습니다.
      </div>
    `;
    return;
  }

  if (!posts || posts.length === 0) {
    postList.innerHTML = `
      <div class="empty">
        아직 도착한 편지가 없습니다.<br>
        첫 번째 이야기를 남겨보세요.
      </div>
    `;
    return;
  }

  // 댓글 불러오기
  const { data: comments } = await db
    .from("confession_comments")
    .select("id,confession_id,content,created_at")
    .in(
      "confession_id",
      posts.map(post => post.id)
    )
    .order("created_at", { ascending: true });

  const safeComments = comments || [];

  postList.innerHTML = posts.map(post => {
    const postComments = safeComments.filter(
      comment => comment.confession_id === post.id
    );

    return `
      <article class="post">
        <div class="post-head">
          <span class="target-badge">
            <span>To.</span> ${escapeHTML(post.target_nickname)}
          </span>
          <span class="date">
            ${formatDate(post.created_at)}
          </span>
        </div>

        <div class="post-content">${escapeHTML(post.content)}</div>

        <div class="comment-area">
          <span class="comment-header">답장 및 댓글 (${postComments.length})</span>

          <div id="comments-${post.id}">
            ${
              postComments.length
              ? postComments.map(comment => `
                <div class="comment">
                  <div class="comment-top">
                    <span class="comment-author">익명</span>
                    <span class="comment-date">${formatDate(comment.created_at)}</span>
                  </div>
                  <div>${escapeHTML(comment.content)}</div>
                </div>
              `).join("")
              : `
                <div class="comment-empty">
                  아직 남겨진 답장이 없습니다.
                </div>
              `
            }
          </div>

          <form class="comment-form" data-post-id="${post.id}">
            <input
              name="comment"
              maxlength="500"
              placeholder="따뜻한 답장을 남겨보세요"
              required
            >
            <button type="submit">등록</button>
          </form>
        </div>
      </article>
    `;
  }).join("");

  document
    .querySelectorAll(".comment-form")
    .forEach(form => {
      form.addEventListener("submit", addComment);
    });
}

// ===================================
// 5. 익명 댓글 등록
// ===================================

async function addComment(event) {
  event.preventDefault();
  if (!db) return;

  const form = event.currentTarget;
  const postId = form.dataset.postId;
  const content = form.elements.comment.value.trim();
  const button = form.querySelector("button");

  if (!content) return;
  button.disabled = true;

  const { error } = await db
    .from("confession_comments")
    .insert({
      confession_id: postId,
      content: content
    });

  button.disabled = false;

  if (error) {
    alert("댓글 등록에 실패했습니다. 다시 시도해 주세요.");
    return;
  }

  await loadPosts();
}

// ===================================
// 6. 게시판 시작
// ===================================

loadPosts();
</script>

</body>
</html>
