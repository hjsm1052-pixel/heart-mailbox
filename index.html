
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀스러운 고백</title>

<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
:root {
  --paper:#FBF9F6;
  --ink:#302A29;
  --sub:#817674;
  --muted:#AAA09C;
  --rose:#985966;
  --rose-dark:#79434F;
  --rose-light:#F3E9E9;
  --line:#EAE2DE;
  --white:#FFFFFF;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Pretendard",sans-serif;
  min-height:100vh;
}

.container {
  max-width:760px;
  margin:auto;
  padding:70px 25px 55px;
}

/* 상단 */

.header {
  text-align:center;
  padding:35px 15px 55px;
  margin-bottom:35px;
  position:relative;
}

.header::after {
  content:"";
  display:block;
  width:38px;
  height:1px;
  background:var(--rose);
  margin:28px auto 0;
}

.header h1 {
  font-family:"Noto Serif KR",serif;
  font-size:34px;
  font-weight:500;
  letter-spacing:-1.5px;
  margin:0 0 20px;
}

.header p {
  color:var(--sub);
  font-size:14px;
  line-height:1.9;
  margin:3px 0;
  letter-spacing:-.2px;
}

.header .header-main {
  color:var(--ink);
  font-size:15px;
  margin-bottom:5px;
}

/* 게시글 */

.post {
  padding:28px 5px 30px;
  border-bottom:1px solid var(--line);
}

.post:first-child {
  border-top:1px solid var(--line);
}

.post-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.target-badge {
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:14px;
  font-weight:600;
  color:var(--rose);
}

.target-badge .to {
  font-family:"Noto Serif KR",serif;
  font-size:13px;
  font-weight:400;
  color:var(--muted);
}

.date,.comment-date {
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
}

.post-content {
  white-space:pre-wrap;
  font-size:15px;
  line-height:2;
  margin:0 0 22px;
  word-break:keep-all;
}

.post-actions {
  text-align:right;
  margin:0 0 18px;
}

.delete-button {
  background:transparent;
  border:0;
  color:#A99D99;
  font-size:11px;
  padding:5px 7px;
  cursor:pointer;
}

.delete-button:hover {
  color:var(--rose);
  background:transparent;
}

.admin-button {
  color:var(--rose);
}

/* 댓글 */

.comment-area {
  padding:18px 0 0;
  border-top:1px solid var(--line);
}

.comment-header {
  display:block;
  color:var(--sub);
  font-size:12px;
  font-weight:600;
  margin-bottom:14px;
}

.comment {
  padding:13px 0;
  border-bottom:1px solid #F0EAE6;
}

.comment:last-child {
  border-bottom:0;
}

.comment-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
}

.comment-author {
  font-size:11px;
  color:var(--rose);
  font-weight:600;
}

.comment-content {
  font-size:13.5px;
  line-height:1.8;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-actions {
  text-align:right;
  margin-top:5px;
}

.comment-empty {
  color:var(--muted);
  font-size:12px;
  padding:4px 0 12px;
}

/* 입력 영역 */

.panel {
  margin-top:65px;
  padding:35px 0 0;
  border-top:1px solid var(--line);
}

.panel h2 {
  font-family:"Noto Serif KR",serif;
  font-size:23px;
  font-weight:500;
  letter-spacing:-.7px;
  margin:0 0 10px;
}

.panel-sub {
  color:var(--sub);
  font-size:13px;
  margin:0 0 28px;
  line-height:1.7;
}

.field-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:20px 0 9px;
}

label {
  font-size:13px;
  font-weight:600;
  color:var(--ink);
}

.field-hint {
  font-size:11px;
  color:var(--muted);
  font-weight:400;
}

input,textarea {
  width:100%;
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  padding:13px 2px;
  background:transparent;
  color:var(--ink);
  font:inherit;
  font-size:14px;
}

input::placeholder,textarea::placeholder {
  color:#B7AEAA;
}

input:focus,textarea:focus {
  outline:none;
  border-bottom-color:var(--rose);
}

textarea {
  height:145px;
  resize:vertical;
  line-height:1.8;
}

.two-column {
  display:grid;
  grid-template-columns:1fr 190px;
  gap:24px;
}

.comment-form {
  display:grid;
  grid-template-columns:minmax(0,1fr) 150px auto;
  align-items:center;
  gap:12px;
  margin-top:17px;
}

.comment-form input {
  min-width:0;
  font-size:12.5px;
  padding:11px 2px;
}

button {
  font-family:inherit;
  cursor:pointer;
}

.comment-form button {
  border:0;
  background:transparent;
  color:var(--rose);
  font-size:12px;
  font-weight:600;
  padding:10px 3px;
  white-space:nowrap;
}

.comment-form button:hover {
  color:var(--rose-dark);
}

.submit {
  display:block;
  width:100%;
  margin-top:30px;
  padding:16px;
  border:0;
  background:var(--rose);
  color:white;
  font-size:14px;
  font-weight:600;
  letter-spacing:.5px;
  transition:background .2s;
}

.submit:hover {
  background:var(--rose-dark);
}

button:disabled {
  opacity:.5;
  cursor:wait;
}

.status {
  color:var(--rose);
  font-size:12px;
  text-align:center;
  min-height:20px;
  margin-top:13px;
}

.note {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.8;
  margin:18px 0 0;
}

/* 빈 화면 */

.empty {
  text-align:center;
  padding:55px 15px;
  color:var(--muted);
  font-size:13px;
  line-height:2;
}

/* 하단 */

.footer {
  text-align:center;
  padding:55px 10px 10px;
  color:var(--muted);
  font-family:"Noto Serif KR",serif;
  font-size:12px;
  line-height:1.8;
}

.admin-area {
  margin-top:22px;
  text-align:center;
}

.admin-login {
  background:transparent;
  border:0;
  color:#B5AAA5;
  font-size:10px;
  padding:7px;
}

.admin-login:hover {
  color:var(--rose);
  background:transparent;
}

.admin-state {
  color:var(--rose);
  font-size:11px;
}

@media(max-width:600px) {
  .container {
    padding:40px 19px 40px;
  }

  .header {
    padding:30px 5px 42px;
  }

  .header h1 {
    font-size:28px;
  }

  .post {
    padding:24px 2px;
  }

  .panel {
    margin-top:48px;
  }

  .two-column {
    grid-template-columns:1fr 135px;
    gap:15px;
  }

  .comment-form {
    grid-template-columns:1fr 125px;
    gap:10px;
  }

  .comment-form button {
    grid-column:1 / -1;
    justify-self:end;
  }
}

@media(max-width:380px) {
  .two-column {
    grid-template-columns:1fr;
    gap:0;
  }

  .header h1 {
    font-size:25px;
  }
}
</style>
</head>

<body>

<main class="container">

  <header class="header">
    <h1>비밀스러운 고백</h1>
    <p class="header-main">마음속에 담아두었던 진심을 전해보세요.</p>
    <p>보내는 이의 흔적 없이 오직 마음만 전달되는 익명 공간입니다.</p>
  </header>

  <!-- 게시글 목록 -->
  <section id="postList" aria-live="polite">
    <div class="empty">마음을 불러오고 있습니다...</div>
  </section>

  <!-- 마음 전하기 -->
  <section class="panel">

    <h2>익명으로 마음 전하기</h2>
    <p class="panel-sub">
      전하지 못했던 마음을 이곳에 조용히 남겨보세요.
    </p>

    <form id="confessionForm">

      <div class="two-column">

        <div>
          <div class="field-row">
            <label for="target">받는 사람</label>
          </div>
          <input
            id="target"
            type="text"
            maxlength="40"
            placeholder="상대방 닉네임"
            required
          >
        </div>

        <div>
          <div class="field-row">
            <label for="postPassword">삭제 비밀번호</label>
            <span class="field-hint">비밀번호(4자 이상)</span>
          </div>
          <input
            id="postPassword"
            type="password"
            minlength="4"
            maxlength="50"
            autocomplete="new-password"
            placeholder="비밀번호 입력"
            required
          >
        </div>

      </div>

      <div class="field-row">
        <label for="content">전하고 싶은 이야기</label>
      </div>

      <textarea
        id="content"
        maxlength="1500"
        placeholder="평소 건네지 못했던 진심을 차분히 적어보세요."
        required
      ></textarea>

      <button class="submit" id="submitButton" type="submit">
        마음 전하기
      </button>

      <div class="status" id="formStatus" aria-live="polite"></div>

    </form>

    <p class="note">
      닉네임과 고백 내용은 공개됩니다.<br>
      삭제 비밀번호는 공개되지 않으니 꼭 기억해 주세요.
    </p>

  </section>

  <footer class="footer">
    서로의 진심이 모여 따뜻한 인연이 되기를 바랍니다.

    <div class="admin-area">
      <span id="adminState" class="admin-state"></span>
      <button id="adminLoginButton" class="admin-login" type="button">
        관리자 모드
      </button>
      <button id="adminLogoutButton" class="admin-login"
        type="button" style="display:none">
        관리자 모드 종료
      </button>
    </div>
  </footer>

</main>

<script>
// ===================================
// 1. Supabase 연결
// ===================================

const SUPABASE_URL =
"https://vuvzchrhbdgtsfjoobrb.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_E0GSkkS2vp-oknFC9nfvAg_Ky-JhpBH";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const postList = document.getElementById("postList");
const formStatus = document.getElementById("formStatus");

let isAdmin = false;
let adminPassword = "";


// ===================================
// 2. 공통 함수
// ===================================

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function formatDate(value) {
  return new Date(value).toLocaleString("ko-KR", {
    month:"long",
    day:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}


// ===================================
// 3. 게시글 작성
// ===================================

document.getElementById("confessionForm")
.addEventListener("submit", async function(event) {

  event.preventDefault();

  const target = document.getElementById("target").value.trim();
  const content = document.getElementById("content").value.trim();
  const password = document.getElementById("postPassword").value;

  if (!target || !content || password.length < 4) {
    formStatus.textContent = "모든 항목을 정확히 입력해 주세요.";
    return;
  }

  const button = document.getElementById("submitButton");

  button.disabled = true;
  formStatus.textContent = "마음을 전달하고 있습니다...";

  try {
    const { error } = await db.rpc("create_confession", {
      p_target_nickname: target,
      p_content: content,
      p_password: password
    });

    if (error) throw error;

    this.reset();
    formStatus.textContent = "마음이 안전하게 전달되었습니다.";

    await loadPosts();

  } catch (error) {
    console.error(error);
    formStatus.textContent =
      "등록에 실패했습니다. Supabase 설정을 확인해 주세요.";
  } finally {
    button.disabled = false;
  }
});


// ===================================
// 4. 게시글 불러오기
// ===================================

async function loadPosts() {

  const { data: posts, error } = await db
    .from("confessions")
    .select("id,target_nickname,content,created_at")
    .order("created_at", { ascending:false })
    .limit(100);

  if (error) {
    console.error(error);
    postList.innerHTML =
      '<div class="empty">게시글을 불러오지 못했습니다.</div>';
    return;
  }

  if (!posts || posts.length === 0) {
    postList.innerHTML = `
      <div class="empty">
        아직 도착한 마음이 없습니다.<br>
        첫 번째 이야기를 남겨보세요.
      </div>
    `;
    return;
  }

  const postIds = posts.map(post => post.id);

  const { data: comments, error: commentError } = await db
    .from("confession_comments")
    .select("id,confession_id,content,created_at")
    .in("confession_id", postIds)
    .order("created_at", { ascending:true });

  if (commentError) console.error(commentError);

  const safeComments = comments || [];

  postList.innerHTML = posts.map(post => {

    const postComments = safeComments.filter(
      comment => comment.confession_id === post.id
    );

    return `
      <article class="post">

        <div class="post-head">
          <span class="target-badge">
            <span class="to">To.</span>
            ${escapeHTML(post.target_nickname)}
          </span>

          <span class="date">${formatDate(post.created_at)}</span>
        </div>

        <div class="post-content">${escapeHTML(post.content)}</div>

        <div class="post-actions">

          <button class="delete-button"
            type="button"
            onclick="deletePost('${post.id}')">
            본인 삭제
          </button>

          ${isAdmin ? `
            <button class="delete-button admin-button"
              type="button"
              onclick="adminDelete('post','${post.id}')">
              관리자 삭제
            </button>
          ` : ""}

        </div>

        <div class="comment-area">

          <span class="comment-header">
            답장 및 댓글 (${postComments.length})
          </span>

          ${
            postComments.length
            ? postComments.map(comment => `
              <div class="comment">

                <div class="comment-top">
                  <span class="comment-author">익명</span>
                  <span class="comment-date">
                    ${formatDate(comment.created_at)}
                  </span>
                </div>

                <div class="comment-content">
                  ${escapeHTML(comment.content)}
                </div>

                <div class="comment-actions">

                  <button class="delete-button"
                    type="button"
                    onclick="deleteComment('${comment.id}')">
                    본인 삭제
                  </button>

                  ${isAdmin ? `
                    <button class="delete-button admin-button"
                      type="button"
                      onclick="adminDelete('comment','${comment.id}')">
                      관리자 삭제
                    </button>
                  ` : ""}

                </div>

              </div>
            `).join("")
            : `
              <div class="comment-empty">
                아직 남겨진 답장이 없습니다.
              </div>
            `
          }

          <form class="comment-form" data-post-id="${post.id}">

            <input
              name="comment"
              maxlength="500"
              placeholder="따뜻한 답장을 남겨보세요"
              required
            >

            <input
              name="password"
              type="password"
              minlength="4"
              maxlength="50"
              autocomplete="new-password"
              placeholder="비밀번호(4자 이상)"
              required
            >

            <button type="submit">댓글 등록</button>

          </form>

        </div>

      </article>
    `;

  }).join("");

  document.querySelectorAll(".comment-form")
    .forEach(form => {
      form.addEventListener("submit", addComment);
    });
}


// ===================================
// 5. 댓글 작성
// ===================================

async function addComment(event) {

  event.preventDefault();

  const form = event.currentTarget;
  const postId = form.dataset.postId;
  const content = form.elements.comment.value.trim();
  const password = form.elements.password.value;

  const button = form.querySelector("button");

  if (!content || password.length < 4) {
    alert("댓글과 비밀번호(4자 이상)를 입력해 주세요.");
    return;
  }

  button.disabled = true;

  try {
    const { error } = await db.rpc("create_comment", {
      p_confession_id: postId,
      p_content: content,
      p_password: password
    });

    if (error) throw error;

    await loadPosts();

  } catch (error) {
    console.error(error);
    alert("댓글 등록에 실패했습니다. 다시 시도해 주세요.");
    button.disabled = false;
  }
}


// ===================================
// 6. 본인 게시글 삭제
// ===================================

async function deletePost(postId) {

  const password = prompt(
    "게시글 작성 시 설정한 삭제 비밀번호를 입력해 주세요."
  );

  if (password === null) return;

  if (!password) {
    alert("비밀번호를 입력해 주세요.");
    return;
  }

  if (!confirm("이 게시글과 댓글을 모두 삭제할까요?")) return;

  try {
    const { data, error } = await db.rpc("delete_confession", {
      p_confession_id: postId,
      p_password: password
    });

    if (error) throw error;

    if (data !== true) {
      alert("비밀번호가 일치하지 않거나 삭제할 수 없는 게시글입니다.");
      return;
    }

    alert("게시글이 삭제되었습니다.");
    await loadPosts();

  } catch (error) {
    console.error(error);
    alert("게시글 삭제에 실패했습니다.");
  }
}


// ===================================
// 7. 본인 댓글 삭제
// ===================================

async function deleteComment(commentId) {

  const password = prompt(
    "댓글 작성 시 설정한 삭제 비밀번호를 입력해 주세요."
  );

  if (password === null) return;

  if (!password) {
    alert("비밀번호를 입력해 주세요.");
    return;
  }

  if (!confirm("이 댓글을 삭제할까요?")) return;

  try {
    const { data, error } = await db.rpc("delete_comment", {
      p_comment_id: commentId,
      p_password: password
    });

    if (error) throw error;

    if (data !== true) {
      alert("비밀번호가 일치하지 않거나 삭제할 수 없는 댓글입니다.");
      return;
    }

    alert("댓글이 삭제되었습니다.");
    await loadPosts();

  } catch (error) {
    console.error(error);
    alert("댓글 삭제에 실패했습니다.");
  }
}


// ===================================
// 8. 관리자 모드 로그인
// ===================================

document.getElementById("adminLoginButton")
.addEventListener("click", async function() {

  const password = prompt("관리자 비밀번호를 입력해 주세요.");

  if (password === null) return;

  if (!password) {
    alert("관리자 비밀번호를 입력해 주세요.");
    return;
  }

  try {
    const { data, error } = await db.functions.invoke(
      "admin-delete",
      {
        body: {
          type:"verify",
          password:password
        }
      }
    );

    if (error) throw error;

    if (!data || !data.success) {
      alert(data?.error || "관리자 인증에 실패했습니다.");
      return;
    }

    isAdmin = true;
    adminPassword = password;

    document.getElementById("adminLoginButton").style.display = "none";
    document.getElementById("adminLogoutButton").style.display = "inline-block";
    document.getElementById("adminState").textContent = "관리자 모드 활성화";

    alert("관리자 인증이 완료되었습니다.");

    await loadPosts();

  } catch (error) {
    console.error(error);
    alert("관리자 인증에 실패했습니다. Edge Function 설정을 확인해 주세요.");
  }
});


// ===================================
// 9. 관리자 모드 종료
// ===================================

document.getElementById("adminLogoutButton")
.addEventListener("click", async function() {

  isAdmin = false;
  adminPassword = "";

  document.getElementById("adminLoginButton").style.display = "inline-block";
  document.getElementById("adminLogoutButton").style.display = "none";
  document.getElementById("adminState").textContent = "";

  await loadPosts();
});


// ===================================
// 10. 관리자 게시글 및 댓글 삭제
// ===================================

async function adminDelete(type, id) {

  if (!isAdmin || !adminPassword) {
    alert("관리자 인증이 필요합니다.");
    return;
  }

  const targetName =
    type === "post" ? "게시글과 해당 댓글" : "댓글";

  if (!confirm(
    `관리자 권한으로 ${targetName}을(를) 삭제할까요?`
  )) return;

  try {
    const { data, error } = await db.functions.invoke(
      "admin-delete",
      {
        body: {
          type:type,
          id:id,
          password:adminPassword
        }
      }
    );

    if (error) throw error;

    if (!data || !data.success) {
      alert(data?.error || "관리자 삭제에 실패했습니다.");
      return;
    }

    alert("관리자 권한으로 삭제되었습니다.");
    await loadPosts();

  } catch (error) {
    console.error(error);
    alert("관리자 삭제에 실패했습니다. Edge Function 설정을 확인해 주세요.");
  }
}


// ===================================
// 11. 게시판 시작
// ===================================

loadPosts();

</script>
